<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4f5f4">
<title>Team YE 羽球戰術板</title>
<meta name="apple-mobile-web-app-title" content="Team YE 戰術板">
<script>
  // 從 LINE 打開：改用 Safari 開（LINE 內建瀏覽器往下拖會關掉網頁，分享面板也不穩）
  if (/\bLine\//i.test(navigator.userAgent) && !/openExternalBrowser=1/.test(location.search)) {
    location.replace(location.pathname + (location.search ? location.search + '&' : '?') + 'openExternalBrowser=1' + location.hash);
  }
</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
<link rel="stylesheet" href="styles.css?v=14">
</head>
<body>
<div class="app">
  <main class="stage">
    <svg id="board" viewBox="-0.38 -0.45 6.86 14.3" preserveAspectRatio="xMidYMid meet" aria-label="Team YE 羽球戰術板 球場"></svg>
    <div class="pmenu" id="pmenu" hidden>
      <div class="pmenu-head"><span>持拍手</span><span>拖曳＝旋轉</span></div>
      <div class="seg2" role="radiogroup" aria-label="持拍手">
        <button role="radio" data-hand="L" aria-checked="false">左手</button>
        <button role="radio" data-hand="R" aria-checked="true">右手</button>
      </div>
    </div>
    <div class="angle-tag" id="angle" hidden></div>
    <div class="loading" id="loading3d" hidden>載入中…</div>
  </main>

  <nav class="rail" aria-label="工具列">
    <button class="tool" data-tool="move" data-icon="move" aria-pressed="true"><span>移動</span></button>
    <button class="tool" data-tool="pen" data-icon="pen" aria-pressed="false"><span>螢光筆</span></button>
    <button class="tool" data-tool="arrow" data-icon="arrow" aria-pressed="false"><span>箭頭</span></button>
    <button class="tool" data-tool="erase" data-icon="erase" aria-pressed="false"><span>橡皮擦</span></button>
    <div class="divider"></div>
    <button class="icon-btn" id="undo" data-icon="undo" aria-label="上一步" disabled></button>
    <button class="icon-btn" id="redo" data-icon="redo" aria-label="下一步" disabled></button>
    <div class="spacer"></div>
    <div class="seg" role="radiogroup" aria-label="視角">
      <button role="radio" data-view="top" aria-checked="true">俯瞰</button>
      <button role="radio" data-view="3d" aria-checked="false">斜角</button>
    </div>
    <div class="seg" role="radiogroup" aria-label="單雙打">
      <button role="radio" data-mode="double" aria-checked="true">雙打</button>
      <button role="radio" data-mode="single" aria-checked="false">單打</button>
    </div>
    <button class="tool primary" id="shot" data-icon="camera"><span>截圖</span></button>
    <button class="tool" id="more" data-icon="more"><span>更多</span></button>
  </nav>

  <div class="pop" id="pop-pen" hidden>
    <div class="swatches" role="radiogroup" aria-label="螢光筆顏色">
      <button role="radio" data-color="hl-1" aria-label="黃" aria-checked="true"><i style="background:var(--hl-1)"></i></button>
      <button role="radio" data-color="hl-2" aria-label="粉" aria-checked="false"><i style="background:var(--hl-2)"></i></button>
      <button role="radio" data-color="hl-3" aria-label="青" aria-checked="false"><i style="background:var(--hl-3)"></i></button>
    </div>
    <div class="pop-line"></div>
    <label class="switch-row"><span>畫圈自動填滿</span><button role="switch" id="autofill" aria-checked="true"><i></i></button></label>
  </div>
  <div class="pop pop-menu" id="pop-more" hidden>
    <button id="clear-marks">清除所有標示</button>
    <div class="pop-line"></div>
    <button id="reset-pos">重置球員站位</button>
  </div>
  <div class="dialog-back" id="dialog" hidden>
    <div class="dialog" role="alertdialog" aria-labelledby="dlg-title">
      <h2 id="dlg-title"></h2>
      <p id="dlg-body"></p>
      <p class="dlg-hint">（按錯可以按「上一步」救回）</p>
      <div class="dlg-btns"><button id="dlg-cancel">取消</button><button id="dlg-ok" class="danger"></button></div>
    </div>
  </div>
  <div class="dialog-back" id="preview" hidden>
    <div class="dialog preview">
      <h2>截圖預覽</h2>
      <img id="preview-img" alt="截圖預覽">
      <p class="dlg-hint" id="preview-hint">也可以長按圖片存到相簿</p>
      <div class="dlg-btns"><button id="preview-close">關閉</button><button id="preview-share" class="primary">存相簿／傳 LINE</button></div>
    </div>
  </div>
  <div class="pop" id="pop-arrow" hidden>
    <div class="kinds" role="radiogroup" aria-label="箭頭種類">
      <button role="radio" data-kind="shot" aria-checked="true"><svg viewBox="0 0 64 16"><path d="M4 8h48"/><path d="M50 3l8 5-8 5z" class="head"/></svg><span>球路（實線）</span></button>
      <button role="radio" data-kind="run" aria-checked="false"><svg viewBox="0 0 64 16"><path d="M4 8h48" stroke-dasharray="6 5"/><path d="M50 3l8 5-8 5z" class="head"/></svg><span>跑位（虛線）</span></button>
    </div>
  </div>
</div>
<script src="board.js?v=14"></script>
<script src="main.js?v=14"></script>
</body>
</html>
